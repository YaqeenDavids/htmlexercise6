<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Contact Us</h1>
        <p>Get in touch with us for any inquiries or appointments.</p>
    </header>

    <!-- Contact Form Section -->
    <section>
        <h2>Contact Form</h2>

        <form>
            <label for="Yaqeen">Name:</label><br>
            <input type="text" id="Yaqeen" name="Yaqeen"><br><br>

            <label for="yaqeend.davids@gmail.com">Email:</label><br>
            <input type="email" id="yaqeend.davids@gmail.com" name="yaqeend.davids@gmail.com"><br><br>

            <label for="0662523527">Phone:</label><br>
            <input type="tel" id="0662523527" name="0662523527"><br><br>

            <label for="LC Coding">Subject:</label><br>
            <select id="subject" name="LC Coding">
                <option value="">Select Subject</option>
                <option value="appointment">Appointment</option>
                <option value="support">Support</option>
                <option value="feedback">Feedback</option>
            </select><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="30"></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </section>

    <!-- Schedule Table Section -->
    <section>
        <h2>Available Appointment Times</h2>

        <table border="1">
            <tr>
                <th>Day</th>
                <th>Morning</th>
                <th>Afternoon</th>
            </tr>
            <tr>
                <td>Monday</td>
                <td>9:00 AM</td>
                <td>2:00 PM</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>10:00 AM</td>
                <td>3:00 PM</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>9:30 AM</td>
                <td>1:30 PM</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>8:00 AM</td>
                <td>2:30 PM</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>11:00 AM</td>
                <td>4:00 PM</td>
            </tr>
        </table>
    </section>

</body>
</html>
